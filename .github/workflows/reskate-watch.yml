name: ReSkate watch

# Every hour, looks for a new ReSkate release and files what it changes for
# the manager (cmd/reskate-watch) as an issue labelled reskate. The newest
# such issue says which release was reported last.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      from:
        description: Compare from this ReSkate release, and report the latest even if it was already
        required: false
      dry_run:
        description: Only show the report in the run's summary; file no issue
        type: boolean
        default: false

permissions: {}

# One at a time, so two runs never file the same release.
concurrency:
  group: reskate-watch

env:
  UPSTREAM: Dingo-Shenanigans/ReSkate

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      from: ${{ steps.find.outputs.from }}
      to: ${{ steps.find.outputs.to }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FROM: ${{ inputs.from }}
        run: |
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          last=$(gh issue list --label reskate --state all --limit 1 --json body --jq '.[0].body // ""' |
            sed -n 's/^<!-- reskate-watch \(.*\) -->$/\1/p')
          if [ -n "$FROM" ]; then
            from=$FROM
          elif [ "$last" = "$latest" ]; then
            echo "ReSkate $latest was reported already."
            exit 0
          elif [ -n "$last" ]; then
            from=$last
          else
            # The first run: compare with the release before.
            from=$(gh api "repos/$UPSTREAM/releases" --jq '[.[] | select(.draft or .prerelease | not) | .tag_name][1]')
          fi
          echo "Reporting ReSkate $latest, compared with $from."
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$latest" >> "$GITHUB_OUTPUT"

  # Runs ReSkate's server, so it can read the repository and nothing more.
  check:
    needs: find
    if: needs.find.outputs.to != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      title: ${{ steps.report.outputs.title }}
      open: ${{ steps.report.outputs.open }}
      body: ${{ steps.report.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: report
        env:
          FROM: ${{ needs.find.outputs.from }}
          TO: ${{ needs.find.outputs.to }}
        run: |
          git clone --quiet --no-checkout "https://github.com/$UPSTREAM.git" "$RUNNER_TEMP/reskate"
          go run ./cmd/reskate-watch -repo "$UPSTREAM" -src "$RUNNER_TEMP/reskate" -from "$FROM" -to "$TO" \
            -out "$RUNNER_TEMP/report.md" -summary "$RUNNER_TEMP/summary.json"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          eof=$(openssl rand -hex 16)
          {
            echo "title=$(jq -r .title "$RUNNER_TEMP/summary.json")"
            echo "open=$(jq -r .open "$RUNNER_TEMP/summary.json")"
            echo "body<<$eof"
            cat "$RUNNER_TEMP/report.md"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"

  # Files the report. A release with nothing to apply is filed closed, so
  # every release is on record and only work stays open, assigned.
  file:
    needs: check
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.check.outputs.title }}
          OPEN: ${{ needs.check.outputs.open }}
          BODY: ${{ needs.check.outputs.body }}
        run: |
          gh label create reskate --force --color 5319e7 --description "What a ReSkate release changes for the manager"
          printf '%s\n' "$BODY" > body.md
          if [ "$OPEN" = true ]; then
            gh issue create --title "$TITLE" --label reskate --assignee "$GITHUB_REPOSITORY_OWNER" --body-file body.md
          else
            gh issue close "$(gh issue create --title "$TITLE" --label reskate --body-file body.md)" --reason completed
          fi

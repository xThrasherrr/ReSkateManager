name: ReSkate watch

# Every hour, looks for a new ReSkate release and checks what it changes for
# the manager (cmd/reskate-watch). A release that needs work is filed as an
# issue labelled reskate; every report is kept as an artifact named after its
# release, which is how a run knows the release was checked already.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      from:
        description: Compare from this ReSkate release, and check the latest even if it was already
        required: false
      dry_run:
        description: Only show the report in the run's summary; file and keep nothing
        type: boolean
        default: false

permissions: {}

# One at a time, so two runs never file the same release.
concurrency:
  group: reskate-watch

env:
  UPSTREAM: Dingo-Shenanigans/ReSkate

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: read
    outputs:
      from: ${{ steps.find.outputs.from }}
      to: ${{ steps.find.outputs.to }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FROM: ${{ inputs.from }}
        run: |
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          artifacts="repos/$GITHUB_REPOSITORY/actions/artifacts"
          checked=$(gh api "$artifacts?name=reskate-watch-$latest" --jq .total_count)
          reported=$(gh issue list --label reskate --state all --limit 1 --json body --jq '.[0].body // ""' |
            sed -n 's/^<!-- reskate-watch \(.*\) -->$/\1/p')
          if [ -n "$FROM" ]; then
            from=$FROM
          elif [ "$checked" != 0 ] || [ "$reported" = "$latest" ]; then
            echo "ReSkate $latest was checked already."
            exit 0
          else
            # The last release checked, newest first; on the first run, the release before.
            from=$(gh api "$artifacts?per_page=100" \
              --jq '[.artifacts[].name | select(startswith("reskate-watch-"))][0] // "" | ltrimstr("reskate-watch-")')
            if [ -z "$from" ]; then
              from=$(gh api "repos/$UPSTREAM/releases" --jq '[.[] | select(.draft or .prerelease | not) | .tag_name][1]')
            fi
          fi
          echo "Checking ReSkate $latest, compared with $from."
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$latest" >> "$GITHUB_OUTPUT"

  # Runs ReSkate's server, so it can read the repository and nothing more.
  check:
    needs: find
    if: needs.find.outputs.to != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      title: ${{ steps.report.outputs.title }}
      open: ${{ steps.report.outputs.open }}
      body: ${{ steps.report.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: report
        env:
          FROM: ${{ needs.find.outputs.from }}
          TO: ${{ needs.find.outputs.to }}
        run: |
          git clone --quiet --no-checkout "https://github.com/$UPSTREAM.git" "$RUNNER_TEMP/reskate"
          go run ./cmd/reskate-watch -repo "$UPSTREAM" -src "$RUNNER_TEMP/reskate" -from "$FROM" -to "$TO" \
            -out "$RUNNER_TEMP/report.md" -summary "$RUNNER_TEMP/summary.json"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          eof=$(openssl rand -hex 16)
          {
            echo "title=$(jq -r .title "$RUNNER_TEMP/summary.json")"
            echo "open=$(jq -r .open "$RUNNER_TEMP/summary.json")"
            echo "body<<$eof"
            cat "$RUNNER_TEMP/report.md"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"

  # Files a release that needs work, then keeps the report. The report is
  # kept last, so a release whose issue couldn't be filed is checked again.
  file:
    needs: [find, check]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          BODY: ${{ needs.check.outputs.body }}
        run: printf '%s\n' "$BODY" > report.md
      - if: needs.check.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.check.outputs.title }}
        run: |
          gh label create reskate --force --color 5319e7 --description "What a ReSkate release changes for the manager"
          gh issue create --title "$TITLE" --label reskate --assignee "$GITHUB_REPOSITORY_OWNER" --body-file report.md
      - uses: actions/upload-artifact@v7
        with:
          name: reskate-watch-${{ needs.find.outputs.to }}
          path: report.md
          retention-days: 90
